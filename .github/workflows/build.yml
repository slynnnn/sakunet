name: build
permissions:
  contents: write
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test
        run: go test ./...
      - name: Build SakuNet.exe
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w" -o SakuNet.exe .
      - name: Fetch sing-box core
        shell: pwsh
        run: ./fetch-core.ps1
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item SakuNet.exe, sing-box.exe dist/
          Get-ChildItem *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination dist/
          Copy-Item nodes.example.json dist/nodes.json
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath SakuNet-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SakuNet-windows-amd64
          path: SakuNet-windows-amd64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SakuNet-windows-amd64.zip
