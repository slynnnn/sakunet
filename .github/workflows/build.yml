name: build
permissions:
  contents: write
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test
        run: go test ./...
      - name: Build SakuNet.exe
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w" -o SakuNet.exe .
      - name: Fetch sing-box core
        shell: pwsh
        run: ./fetch-core.ps1
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item SakuNet.exe, sing-box.exe dist/
          Get-ChildItem *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination dist/
          Copy-Item nodes.example.json dist/nodes.json
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath SakuNet-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SakuNet-windows-amd64
          path: SakuNet-windows-amd64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SakuNet-windows-amd64.zip
  windows-smoke:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SakuNet-windows-amd64
          path: artifact
      - name: Unpack product
        shell: pwsh
        run: |
          Expand-Archive -Path artifact/SakuNet-windows-amd64.zip -DestinationPath smoke -Force
          Get-ChildItem smoke | Format-Table Name, Length
      - name: Start SakuNet and wait for the panel
        shell: pwsh
        run: |
          Start-Process -FilePath .\smoke\SakuNet.exe -WorkingDirectory .\smoke -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..30) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:18090/ -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { throw "panel did not come up on 127.0.0.1:18090" }
      - name: Import the demo Surge config
        shell: pwsh
        run: |
          $rep = curl.exe -s -F file=@internal/surge/testdata/fixture.conf http://127.0.0.1:18090/api/import
          Write-Host $rep
          if ($rep -notmatch '"nodes_ok":3') { throw "fixture import did not report 3 nodes" }
      - name: Start the core and assert status/groups
        shell: pwsh
        run: |
          curl.exe -s -X POST http://127.0.0.1:18090/api/start | Out-Null
          Start-Sleep -Seconds 3
          $st = curl.exe -s http://127.0.0.1:18090/api/status
          Write-Host $st
          if ($st -notmatch '"running":true') { throw "core is not running" }
          $gr = curl.exe -s http://127.0.0.1:18090/api/groups
          Write-Host $gr
          if ($gr -notmatch 'Main') { throw "imported group Main not visible via clash API" }
          if (-not (Get-Process sing-box -ErrorAction SilentlyContinue)) { throw "sing-box process not found" }
      - name: Screenshot the panel home
        shell: pwsh
        run: |
          $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) { $edge = "C:\Program Files\Microsoft\Edge\Application\msedge.exe" }
          & $edge --headless=new --disable-gpu --hide-scrollbars --screenshot=panel-home.png --window-size=900,1400 http://127.0.0.1:18090/
          if (-not (Test-Path panel-home.png)) { throw "screenshot was not produced" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-panel
          path: panel-home.png
      - name: Stop processes
        if: always()
        shell: pwsh
        run: |
          Stop-Process -Name sing-box -Force -ErrorAction SilentlyContinue
          Stop-Process -Name SakuNet -Force -ErrorAction SilentlyContinue
