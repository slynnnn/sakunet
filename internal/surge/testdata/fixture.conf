# SakuNet Surge import test fixture. All credentials are dummy
# values on TEST-NET (192.0.2.0/24) addresses; structure mirrors a
# real-world Surge config's section layout.
[General]
loglevel = notify
dns-server = 223.5.5.5

[Proxy]
🇯🇵 JP Snell = snell, 192.0.2.10, 17886, psk=dummy-psk-123456, version=6, mode=default, tfo=true, reuse=true, ecn=true
🇺🇸 US AnyTLS = anytls, 192.0.2.20, 443, password=dummy-password, sni=example.com, skip-cert-verify=true
SS Demo = ss, 192.0.2.30, 8388, encrypt-method=aes-256-gcm, password=dummy-ss-pass

[Proxy Group]
Main = select, 🇯🇵 JP Snell, 🇺🇸 US AnyTLS, SS Demo, DIRECT
Auto = url-test, 🇯🇵 JP Snell, 🇺🇸 US AnyTLS, url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100

[Rule]
DOMAIN,example.com,Main
DOMAIN-SUFFIX,example.org,Auto
DOMAIN-KEYWORD,example,DIRECT
RULE-SET,https://raw.githubusercontent.com/slynnnn/surge-rules/main/rules/service/netflix.list,Main
RULE-SET,https://raw.githubusercontent.com/slynnnn/surge-rules/main/rules/merged/ai.list,Main
RULE-SET,https://example.com/lists/external.list,Main
IP-CIDR,192.0.2.0/24,DIRECT,no-resolve
DEST-PORT,443,DIRECT
USER-AGENT,SomeApp*,Main
FINAL,Main

[MITM]
hostname = example.com, *.example.org

[URL Rewrite]
^https?://example\.com/old https://example.com/new 302

[Script]
Demo Script = type=http-request, pattern=^https://example\.com, script-path=demo.js, requires-body=false
